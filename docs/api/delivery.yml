        more scopes (e.g. `read:monitors`, `write:monitors`); endpoints
        document the scope they require in their 403 response body.
      scheme: bearer
      type: http
info:
  description: API for notification channel management and alert dispatch.
  title: Holter Delivery API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/v1/email_channels/{email_channel_id}/anti_phishing_code:
    put:
      callbacks: {}
      description: Generate a fresh anti-phishing code. The next email through this channel will carry the new value.
      operationId: HolterWeb.Api.EmailChannelController.rotate_anti_phishing_code
      parameters:
        - description: Email channel UUID
          in: path
          name: email_channel_id
          required: true
          schema:
            format: uuid
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Single email channel response.
                properties:
                  data:
                    additionalProperties: false
                    description: An email delivery channel. Recipients live on a sibling resource and carry their own per-address verification.
                    properties:
                      anti_phishing_code:
                        description: Visual anti-phishing code printed in every email. Rotate via PUT /api/v1/email_channels/:id/anti_phishing_code.
                        type: string
                        x-struct:
                        x-validate:
                      id:
                        format: uuid
                        type: string
                        x-struct:
                        x-validate:
                      inserted_at:
                        format: date-time
                        type: string
                        x-struct:
                        x-validate:
                      last_test_dispatched_at:
                        description: Timestamp of the most recent test ping. Used for cooldown gating.
                        format: date-time
                        nullable: true
                        type: string
                        x-struct:
                        x-validate:
                      name:
                        type: string
                        x-struct:
                        x-validate:
                      settings:
                        additionalProperties: true
                        type: object
                        x-struct:
                        x-validate:
                      updated_at:
                        format: date-time
                        type: string
                        x-struct:
                        x-validate:
                      workspace_id:
                        format: uuid
                        type: string
                        x-struct:
                        x-validate:
                    required:
                      - id
                      - workspace_id
                      - name
                      - settings
                      - anti_phishing_code
                      - last_test_dispatched_at
                      - inserted_at
                      - updated_at
                    title: EmailChannel
                    type: object
                    x-struct:
                    x-validate:
                required:
                  - data
                title: EmailChannelResponse
                type: object
                x-struct:
                x-validate:
          description: Channel with rotated anti_phishing_code
        '404':
          content:
            application/json:
              schema:
                properties:
                  error:
                    properties:
                      code:
                        type: string
                        x-struct:
                        x-validate:
                      message:
                        type: string
                        x-struct:
                        x-validate:
                    type: object
                    x-struct:
                    x-validate:
                title: Error
                type: object
                x-struct:
                x-validate:
          description: Channel not found
      summary: Rotate the anti-phishing code
      tags:
        - Email Channels
  /api/v1/email_channels/{email_channel_id}/delivery_logs:
    get:
      callbacks: {}
      description: List delivery job logs for a webhook or email channel with pagination and filtering.
      operationId: HolterWeb.Api.DeliveryLogController.index
      parameters:
        - description: Webhook channel UUID (when listing logs under /webhook_channels)
          in: path
          name: webhook_channel_id
          required: false
          schema:
            format: uuid
            type: string
            x-struct:
            x-validate:
        - description: Email channel UUID (when listing logs under /email_channels)
          in: path
          name: email_channel_id
          required: false
          schema:
            format: uuid
