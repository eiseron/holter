services:
  holter:
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    tty: true
    stdin_open: true
    working_dir: /usr/src/holter
    entrypoint: .docker/entrypoint.sh
    ports:
      - 4000:4000
    volumes:
      - ./:/usr/src/holter
      - holter_home:/home/holter
      - elixir_build:/usr/src/holter/_build
    command: mix dev
    environment:
      HOME: /home/holter
      DB_NAME: holter_dev
      DB_HOST: db
      DB_USER: holter_admin_login
      DB_PASS: holter_admin
      SENTRY_DSN: "http://public@sentry-mock:8080/1"
    depends_on:
      db:
        condition: service_healthy
      sentry-mock:
        condition: service_started

  sentry-mock:
    image: jmalloc/echo-server
    ports:
      - "8000:8080"

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: holter_dev
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./priv/repo/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d holter_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
  holter_home:
  elixir_build:
